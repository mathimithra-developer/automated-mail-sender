<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mail Sender</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Mail Sender</h1>
        <p class="auth-subtitle">Sign in to manage your automated campaigns</p>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <i data-lucide="mail"></i>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="you@organization.com"
              class="form-input"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <i data-lucide="lock"></i>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="••••••••"
              class="form-input"
            >
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn">
          Sign In
        </button>
      </form>

      <p class="auth-footer">
        New to Mail Sender? 
        <a href="signup" class="auth-link">Create an organization</a>
      </p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById("loginForm");
    const errorDiv = document.getElementById("errorMessage");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerText = "Signing in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = "/dashboard";
        } else {
          errorDiv.innerText = data.error || "Login failed";
          errorDiv.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.innerText = "Sign In";
        }
      } catch (err) {
        console.error(err);
        errorDiv.innerText = "Something went wrong. Ensure the backend database is running.";
        errorDiv.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.innerText = "Sign In";
      }
    });
  </script>
</body>
</html>
